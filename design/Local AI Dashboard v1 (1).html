<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Local AI System Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>

<style>
  :root {
    --bg: #0a0b0e;
    --surface: #111317;
    --surface-2: #161a20;
    --surface-3: #1c2129;
    --border: #23272f;
    --border-strong: #2e333d;
    --text: #e7e9ec;
    --text-dim: #8a8f99;
    --text-mute: #5a5f6a;
    --accent: #b6f24b;       /* lime */
    --accent-dim: #6f9c1f;
    --warn: #f5b53a;
    --crit: #f06464;
    --info: #5cc8ff;
  }
  html, body, #root { height: 100%; }
  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-feature-settings: "ss01","cv11";
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* Subtle background grid */
  .bg-grid {
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #23272f; border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #2e333d; }

  /* Pulse dot */
  @keyframes pulse-soft { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.85); } }
  .pulse-dot { animation: pulse-soft 1.6s ease-in-out infinite; }

  /* Sparkline shimmer for active bar */
  @keyframes shimmer { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }
  .shimmer-bar {
    background-image: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.10) 50%, transparent 100%);
    background-size: 200% 100%;
    animation: shimmer 2.2s linear infinite;
  }

  /* Range input styling */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; background: #23272f; border-radius: 999px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; margin-top: -6px;
    background: var(--accent); border-radius: 999px;
    box-shadow: 0 0 0 4px rgba(182,242,75,0.12), 0 0 18px rgba(182,242,75,0.35);
    border: 2px solid #0a0b0e;
  }
  input[type=range]::-moz-range-track { height: 4px; background: #23272f; border-radius: 999px; }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; background: var(--accent); border-radius: 999px;
    box-shadow: 0 0 0 4px rgba(182,242,75,0.12), 0 0 18px rgba(182,242,75,0.35);
    border: 2px solid #0a0b0e;
  }

  /* Focus rings */
  input[type=text], input[type=number], textarea, select {
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px rgba(182,242,75,0.10);
  }

  /* Caret blink */
  @keyframes blink { 50% { opacity: 0; } }
  .caret { animation: blink 1.1s steps(1) infinite; }

  /* Slide-in for new log line */
  @keyframes logIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .log-line { animation: logIn .22s ease-out; }

  /* Toggle */
  .toggle {
    width: 36px; height: 20px; background: #23272f; border-radius: 999px;
    position: relative; transition: background .18s;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--accent); }
  .toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; background: #0a0b0e; border-radius: 999px;
    transition: transform .18s;
  }
  .toggle.on::after { transform: translateX(16px); background: #0a0b0e; }
</style>
</head>
<body>
<div id="root" class="bg-grid"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo } = React;

// ---------- Icon helper (uses vanilla lucide icon data) ----------
function normalizeAttrs(attrs) {
  const out = {};
  for (const [k, v] of Object.entries(attrs || {})) {
    const camel = k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    out[camel] = v;
  }
  return out;
}
const _iconCache = {};
function LucideIcon({ name, size = 16, strokeWidth = 2, className = '', style = {}, color, ...rest }) {
  const icons = (window.lucide && window.lucide.icons) || {};
  let node = _iconCache[name];
  if (!node) {
    // Try direct PascalCase, kebab-case
    node = icons[name];
    if (!node) {
      const kebab = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
      node = icons[kebab];
    }
    // Some lucide builds expose .icons as an array of [name, data] or object of objects
    if (node && node.toSvg && !Array.isArray(node)) {
      // newer lucide createElement form — fall back: render empty
      node = null;
    }
    if (node) _iconCache[name] = node;
  }
  if (!node || !Array.isArray(node)) return null;
  const [tag, attrs, children] = node;
  const a = normalizeAttrs(attrs);
  return React.createElement(
    tag,
    {
      ...a,
      width: size,
      height: size,
      strokeWidth,
      className,
      style: color ? { ...style, color } : style,
      ...rest,
    },
    (children || []).map(([ctag, cattrs], i) =>
      React.createElement(ctag, { ...normalizeAttrs(cattrs), key: i })
    )
  );
}
// Proxy so existing call sites like <L.Cpu size={14} /> just work
const L = new Proxy({}, {
  get: (_, name) => {
    if (typeof name !== 'string') return undefined;
    const Comp = (props) => <LucideIcon name={name} {...props} />;
    Comp.displayName = `L.${name}`;
    return Comp;
  }
});

// ---------- Helpers ----------
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function useTicker(ms = 1500) {
  const [t, setT] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setT(x => x + 1), ms);
    return () => clearInterval(id);
  }, [ms]);
  return t;
}

// ---------- Hardware Metrics ----------
function useHardware() {
  const [cpu, setCpu] = useState({ pct: 34, temp: 62 });
  const [ram, setRam] = useState({ used: 18.4, total: 32 });
  const [vram, setVram] = useState({ used: 6.2, total: 8.0 });
  const [gpu, setGpu] = useState({ pct: 71, temp: 68 });

  useEffect(() => {
    const id = setInterval(() => {
      setCpu(c => ({
        pct: clamp(c.pct + (Math.random() - 0.5) * 8, 18, 72),
        temp: clamp(c.temp + (Math.random() - 0.5) * 2, 55, 78),
      }));
      setRam(r => ({ ...r, used: clamp(r.used + (Math.random() - 0.5) * 0.4, 16.8, 22.4) }));
      setVram(v => ({ ...v, used: clamp(v.used + (Math.random() - 0.5) * 0.15, 5.9, 7.6) }));
      setGpu(g => ({
        pct: clamp(g.pct + (Math.random() - 0.5) * 12, 35, 96),
        temp: clamp(g.temp + (Math.random() - 0.5) * 2, 62, 79),
      }));
    }, 1400);
    return () => clearInterval(id);
  }, []);
  return { cpu, ram, vram, gpu };
}

// ---------- Progress Bar ----------
function MetricBar({ label, sub, value, max, unit, accent, warn, crit, icon: Icon, right }) {
  const pct = clamp((value / max) * 100, 0, 100);
  let tone = accent || 'var(--accent)';
  let toneSoft = 'rgba(182,242,75,0.12)';
  let glow = '0 0 24px rgba(182,242,75,0.18)';
  if (warn) { tone = 'var(--warn)'; toneSoft = 'rgba(245,181,58,0.14)'; glow = '0 0 24px rgba(245,181,58,0.25)'; }
  if (crit) { tone = 'var(--crit)'; toneSoft = 'rgba(240,100,100,0.14)'; glow = '0 0 24px rgba(240,100,100,0.25)'; }

  return (
    <div className="flex-1 min-w-0">
      <div className="flex items-center gap-2 mb-1.5">
        <Icon size={13} style={{ color: tone }} strokeWidth={2.2} />
        <span className="text-[11px] uppercase tracking-[0.14em] text-[var(--text-dim)] font-medium">{label}</span>
        <span className="text-[11px] text-[var(--text-mute)] mono truncate">{sub}</span>
        <div className="ml-auto flex items-baseline gap-1.5 mono tnum">
          <span className="text-[15px] font-semibold" style={{ color: tone }}>{typeof value === 'number' ? value.toFixed(value < 10 && unit !== '%' ? 1 : (unit === '%' ? 0 : 1)) : value}</span>
          <span className="text-[11px] text-[var(--text-mute)]">{unit}{max && unit !== '%' && unit !== '°C' ? ` / ${max}${unit.replace('GB','')}` : ''}</span>
          {right ? <span className="text-[11px] text-[var(--text-dim)] mono ml-2">{right}</span> : null}
        </div>
      </div>
      <div className="relative h-[6px] rounded-full overflow-hidden" style={{ background: '#191c22' }}>
        <div
          className="absolute inset-y-0 left-0 rounded-full"
          style={{
            width: `${pct}%`,
            background: `linear-gradient(90deg, ${tone} 0%, ${tone} 100%)`,
            boxShadow: glow,
            transition: 'width .9s cubic-bezier(.4,0,.2,1)',
          }}
        >
          <div className="absolute inset-0 shimmer-bar" />
        </div>
        {/* tick marks */}
        <div className="absolute inset-0 flex justify-between px-[2px] pointer-events-none">
          {[...Array(20)].map((_, i) => (
            <div key={i} style={{ width: 1, background: 'rgba(255,255,255,0.025)' }} />
          ))}
        </div>
      </div>
    </div>
  );
}

// ---------- Top Bar ----------
function TopBar({ hw }) {
  const vramPct = (hw.vram.used / hw.vram.total) * 100;
  const vramWarn = vramPct > 70;
  const vramCrit = vramPct > 90;
  const now = new Date();
  const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

  return (
    <header className="h-[88px] border-b border-[var(--border)] bg-[var(--surface)]/80 backdrop-blur flex items-stretch px-5 gap-5 shrink-0">
      {/* Brand */}
      <div className="flex items-center gap-3 pr-5 border-r border-[var(--border)]">
        <div className="w-9 h-9 rounded-lg flex items-center justify-center relative" style={{ background: 'linear-gradient(135deg,#1a1d22 0%,#0e1014 100%)', border: '1px solid var(--border-strong)' }}>
          <div className="absolute inset-0 rounded-lg" style={{ background: 'radial-gradient(circle at 30% 30%, rgba(182,242,75,0.25), transparent 60%)' }} />
          <L.Cpu size={18} style={{ color: 'var(--accent)' }} strokeWidth={2} className="relative" />
        </div>
        <div>
          <div className="text-[13px] font-semibold tracking-tight leading-none">openclaw<span style={{ color: 'var(--accent)' }}>.</span>local</div>
          <div className="text-[10px] text-[var(--text-mute)] mono mt-1 uppercase tracking-[0.18em]">v0.4.2 · linux</div>
        </div>
      </div>

      {/* Hardware metrics row */}
      <div className="flex-1 grid grid-cols-3 gap-7 items-center min-w-0">
        <MetricBar
          label="CPU"
          sub="i7-14700KF · 20c/28t"
          value={hw.cpu.pct}
          max={100}
          unit="%"
          icon={L.Cpu}
          right={`${hw.cpu.temp.toFixed(0)}°C`}
        />
        <MetricBar
          label="RAM"
          sub="32GB DDR5 6400"
          value={hw.ram.used}
          max={hw.ram.total}
          unit="GB"
          icon={L.MemoryStick}
        />
        <MetricBar
          label="VRAM"
          sub="RTX 3070 OC · 8GB"
          value={hw.vram.used}
          max={hw.vram.total}
          unit="GB"
          icon={L.Zap}
          warn={vramWarn && !vramCrit}
          crit={vramCrit}
          right={`${hw.gpu.temp.toFixed(0)}°C`}
        />
      </div>

      {/* Status cluster */}
      <div className="flex items-center gap-4 pl-5 border-l border-[var(--border)]">
        <div className="flex items-center gap-2">
          <span className="w-1.5 h-1.5 rounded-full pulse-dot" style={{ background: 'var(--accent)', boxShadow: '0 0 8px var(--accent)' }} />
          <div>
            <div className="text-[11px] text-[var(--text-dim)] uppercase tracking-[0.14em] leading-none">Ollama</div>
            <div className="text-[12px] mono text-[var(--text)] mt-1 leading-none">:11434 · online</div>
          </div>
        </div>
        <div className="h-8 w-px bg-[var(--border)]" />
        <div className="text-right">
          <div className="text-[11px] text-[var(--text-dim)] uppercase tracking-[0.14em] leading-none">Local time</div>
          <div className="text-[12px] mono mt-1 leading-none tnum">{time}</div>
        </div>
        <button className="w-9 h-9 rounded-lg border border-[var(--border)] hover:border-[var(--border-strong)] flex items-center justify-center hover:bg-[var(--surface-2)] transition">
          <L.Bell size={15} className="text-[var(--text-dim)]" />
        </button>
      </div>
    </header>
  );
}

// ---------- Sidebar ----------
const NAV = [
  { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
  { id: 'models', label: 'Models', icon: 'Boxes', badge: '3' },
  { id: 'agents', label: 'OpenClaw Agents', icon: 'Bot', badge: '5' },
  { id: 'prompts', label: 'Prompts', icon: 'MessageSquare' },
  { id: 'logs', label: 'System Logs', icon: 'ScrollText' },
  { id: 'settings', label: 'Settings', icon: 'Settings' },
];

function Sidebar({ active, setActive }) {
  return (
    <aside className="w-[232px] shrink-0 border-r border-[var(--border)] bg-[var(--surface)]/60 backdrop-blur flex flex-col">
      <div className="px-3 pt-4 pb-2">
        <div className="text-[10px] uppercase tracking-[0.18em] text-[var(--text-mute)] px-3 mb-2">Workspace</div>
        <nav className="space-y-0.5">
          {NAV.map(item => {
            const Icon = L[item.icon] || L.Circle;
            const isActive = active === item.id;
            return (
              <button
                key={item.id}
                onClick={() => setActive(item.id)}
                className="w-full flex items-center gap-3 px-3 py-2 rounded-md text-[13px] transition relative group"
                style={{
                  background: isActive ? 'var(--surface-3)' : 'transparent',
                  color: isActive ? 'var(--text)' : 'var(--text-dim)',
                }}
                onMouseEnter={e => { if (!isActive) e.currentTarget.style.background = 'rgba(255,255,255,0.025)'; }}
                onMouseLeave={e => { if (!isActive) e.currentTarget.style.background = 'transparent'; }}
              >
                {isActive && <span className="absolute left-0 top-1.5 bottom-1.5 w-[2px] rounded-full" style={{ background: 'var(--accent)', boxShadow: '0 0 8px var(--accent)' }} />}
                <Icon size={15} strokeWidth={2} style={{ color: isActive ? 'var(--accent)' : 'currentColor' }} />
                <span className="flex-1 text-left">{item.label}</span>
                {item.badge && (
                  <span className="text-[10px] mono px-1.5 py-0.5 rounded" style={{ background: isActive ? 'rgba(182,242,75,0.12)' : 'var(--surface-2)', color: isActive ? 'var(--accent)' : 'var(--text-mute)' }}>
                    {item.badge}
                  </span>
                )}
              </button>
            );
          })}
        </nav>
      </div>

      <div className="px-3 pt-5 pb-2">
        <div className="text-[10px] uppercase tracking-[0.18em] text-[var(--text-mute)] px-3 mb-2">Active model</div>
        <div className="mx-1 p-3 rounded-lg border border-[var(--border)] bg-[var(--surface-2)]/60">
          <div className="flex items-center gap-2 mb-2">
            <div className="w-6 h-6 rounded flex items-center justify-center" style={{ background: 'rgba(182,242,75,0.10)' }}>
              <L.Sparkles size={12} style={{ color: 'var(--accent)' }} />
            </div>
            <div className="text-[12px] font-medium">qwen3.5:14b</div>
            <span className="ml-auto w-1.5 h-1.5 rounded-full pulse-dot" style={{ background: 'var(--accent)' }} />
          </div>
          <div className="grid grid-cols-2 gap-y-1 gap-x-2 text-[10px] mono">
            <div className="text-[var(--text-mute)]">ctx</div><div className="text-right text-[var(--text-dim)] tnum">8,192</div>
            <div className="text-[var(--text-mute)]">vram</div><div className="text-right text-[var(--text-dim)] tnum">6.2 GB</div>
            <div className="text-[var(--text-mute)]">tok/s</div><div className="text-right tnum" style={{ color: 'var(--accent)' }}>42.7</div>
          </div>
        </div>
      </div>

      <div className="mt-auto p-3 border-t border-[var(--border)]">
        <div className="flex items-center gap-2.5 px-2 py-1.5">
          <div className="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-semibold mono" style={{ background: 'linear-gradient(135deg,#b6f24b,#6f9c1f)', color: '#0a0b0e' }}>K</div>
          <div className="min-w-0 flex-1">
            <div className="text-[12px] truncate">kernel@local</div>
            <div className="text-[10px] text-[var(--text-mute)] mono truncate">/home/k · zsh</div>
          </div>
          <L.ChevronUp size={14} className="text-[var(--text-mute)]" />
        </div>
      </div>
    </aside>
  );
}

// ---------- Terminal / Log Window ----------
const LOG_TEMPLATES = [
  { l: 'INFO ', c: 'var(--info)', src: 'ollama   ', m: 'POST /api/chat 200 — stream open · req_id={id}' },
  { l: 'DEBUG', c: 'var(--text-mute)', src: 'qwen3.5  ', m: 'kv-cache hit ratio=0.{r1}{r2} · layers=64 · gpu=43' },
  { l: 'INFO ', c: 'var(--info)', src: 'openclaw ', m: 'agent[researcher] → tool call: web.search("{q}")' },
  { l: 'OK   ', c: 'var(--accent)', src: 'openclaw ', m: 'agent[coder] task#{id} completed in {t}ms' },
  { l: 'WARN ', c: 'var(--warn)', src: 'cuda     ', m: 'vram pressure 78% — consider lowering --num-gpu-layers' },
  { l: 'INFO ', c: 'var(--info)', src: 'qwen3.5  ', m: 'inference batch=1 prompt_tokens={p} gen_tokens={g} t={t}ms' },
  { l: 'DEBUG', c: 'var(--text-mute)', src: 'openclaw ', m: 'router → routed to agent[{a}] (confidence 0.{r1}{r2})' },
  { l: 'OK   ', c: 'var(--accent)', src: 'ollama   ', m: 'model qwen3.5:14b loaded · 9.84 GB · q4_K_M' },
  { l: 'INFO ', c: 'var(--info)', src: 'memory   ', m: 'vector index synced · 18,442 chunks · embeddings=bge-large' },
  { l: 'WARN ', c: 'var(--warn)', src: 'openclaw ', m: 'rate-limit on agent[researcher] — backoff 1.2s' },
];
const QUERIES = ['"vulkan compute spec"','"react server actions"','"rust async runtime"','"llama.cpp grammar"','"sqlite wal mode"'];
const AGENTS = ['planner','researcher','coder','reviewer','executor'];

function randLog(seq) {
  const t = LOG_TEMPLATES[Math.floor(Math.random() * LOG_TEMPLATES.length)];
  const msg = t.m
    .replace('{id}', (1000 + Math.floor(Math.random() * 9000)).toString(16))
    .replace('{r1}', Math.floor(Math.random() * 10))
    .replace('{r2}', Math.floor(Math.random() * 10))
    .replace('{q}', QUERIES[Math.floor(Math.random() * QUERIES.length)])
    .replace('{t}', (200 + Math.floor(Math.random() * 1800)).toString())
    .replace('{p}', (120 + Math.floor(Math.random() * 800)).toString())
    .replace('{g}', (40 + Math.floor(Math.random() * 400)).toString())
    .replace('{a}', AGENTS[Math.floor(Math.random() * AGENTS.length)]);
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  const ms = String(now.getMilliseconds()).padStart(3,'0');
  return { id: seq, time: `${hh}:${mm}:${ss}.${ms}`, level: t.l, color: t.c, src: t.src, msg };
}

function TerminalLog({ paused, filter }) {
  const [lines, setLines] = useState(() => {
    const initial = [];
    for (let i = 0; i < 14; i++) initial.push(randLog(i));
    return initial;
  });
  const seqRef = useRef(14);
  const bottomRef = useRef(null);
  const scrollRef = useRef(null);
  const [autoscroll, setAutoscroll] = useState(true);

  useEffect(() => {
    if (paused) return;
    const id = setInterval(() => {
      setLines(prev => {
        const next = [...prev, randLog(seqRef.current++)];
        if (next.length > 200) next.shift();
        return next;
      });
    }, 900 + Math.random() * 700);
    return () => clearInterval(id);
  }, [paused]);

  useEffect(() => {
    if (autoscroll && scrollRef.current) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [lines, autoscroll]);

  const filtered = filter === 'all' ? lines : lines.filter(l => l.level.trim().toLowerCase() === filter);

  return (
    <div className="flex-1 flex flex-col rounded-xl overflow-hidden border border-[var(--border)] bg-[#08090b] min-h-0">
      {/* Title bar */}
      <div className="flex items-center gap-2 px-3.5 py-2 border-b border-[var(--border)] bg-[var(--surface)]/60">
        <div className="flex gap-1.5">
          <div className="w-2.5 h-2.5 rounded-full" style={{ background: '#3a2a2a' }} />
          <div className="w-2.5 h-2.5 rounded-full" style={{ background: '#3a3528' }} />
          <div className="w-2.5 h-2.5 rounded-full" style={{ background: '#2a3a2a' }} />
        </div>
        <div className="mx-3 h-3 w-px bg-[var(--border)]" />
        <L.Terminal size={12} className="text-[var(--text-mute)]" />
        <span className="text-[11px] mono text-[var(--text-dim)]">openclaw — qwen3.5:14b · /var/log/ollama</span>
        <div className="ml-auto flex items-center gap-3 text-[11px] mono text-[var(--text-mute)]">
          <span className="flex items-center gap-1.5">
            <span className="w-1.5 h-1.5 rounded-full pulse-dot" style={{ background: paused ? 'var(--warn)' : 'var(--accent)' }} />
            {paused ? 'paused' : 'streaming'}
          </span>
          <span>{filtered.length} lines</span>
        </div>
      </div>

      {/* Body */}
      <div
        ref={scrollRef}
        onScroll={e => {
          const el = e.currentTarget;
          const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 12;
          setAutoscroll(atBottom);
        }}
        className="flex-1 overflow-y-auto mono text-[12px] leading-[1.55] px-4 py-3 selection:bg-[rgba(182,242,75,0.25)]"
      >
        {filtered.map(l => (
          <div key={l.id} className="log-line flex gap-3 whitespace-pre">
            <span className="text-[var(--text-mute)] shrink-0">{l.time}</span>
            <span className="shrink-0 font-semibold" style={{ color: l.color }}>{l.level}</span>
            <span className="text-[var(--text-mute)] shrink-0">{l.src}</span>
            <span className="text-[var(--text)] truncate">{l.msg}</span>
          </div>
        ))}
        <div ref={bottomRef} />
        <div className="flex items-center gap-2 mt-2 text-[var(--text-dim)]">
          <span style={{ color: 'var(--accent)' }}>›</span>
          <span className="caret w-[7px] h-[14px] inline-block" style={{ background: 'var(--accent)' }} />
        </div>
      </div>
    </div>
  );
}

function StatCard({ label, value, sub, accent, icon: Icon, trend, spark }) {
  return (
    <div className="rounded-xl border border-[var(--border)] bg-[var(--surface)] p-4 relative overflow-hidden">
      <div className="flex items-start justify-between mb-3">
        <div className="text-[11px] uppercase tracking-[0.14em] text-[var(--text-dim)]">{label}</div>

      </div>
      <div className="flex items-baseline gap-2 mono tnum">
        <div className="text-[26px] font-semibold tracking-tight" style={{ color: accent || 'var(--text)' }}>{value}</div>
        {sub && <div className="text-[12px] text-[var(--text-mute)]">{sub}</div>}
      </div>
      {trend && (
        <div className="text-[11px] mono mt-1 flex items-center gap-1" style={{ color: trend.up ? 'var(--accent)' : 'var(--crit)' }}>
          {trend.up ? '▲' : '▼'} {trend.label}
        </div>
      )}
      {/* Mini sparkline */}
      {spark && (
        <svg className="absolute bottom-0 right-0 opacity-50" width="120" height="36" viewBox="0 0 120 36" preserveAspectRatio="none">
          <polyline
            fill="none" stroke={accent || 'var(--accent)'} strokeWidth="1.5"
            points={spark.map((y, i) => `${(i / (spark.length-1)) * 120},${36 - y * 32}`).join(' ')}
          />
          <polyline
            fill={accent || 'var(--accent)'} fillOpacity="0.08" stroke="none"
            points={`0,36 ${spark.map((y, i) => `${(i / (spark.length-1)) * 120},${36 - y * 32}`).join(' ')} 120,36`}
          />
        </svg>
      )}
    </div>
  );
}

function Slider({ value, onChange, min, max, step, format }) {
  return (
    <div>
      <div className="flex items-center gap-4">
        <input type="range" min={min} max={max} step={step} value={value} onChange={e => onChange(parseFloat(e.target.value))} />

          <div className="h-8 rounded-md border border-[var(--border)] bg-[var(--surface-2)] flex items-center justify-center mono text-[13px] tnum" style={{ color: 'var(--accent)' }}>
            {format ? format(value) : value}
          </div>
        </div>
      </div>
      <div className="flex justify-between text-[10px] mono text-[var(--text-mute)] mt-1.5 tnum">
        <span>{format ? format(min) : min}</span>
        <span>{format ? format(max) : max}</span>
      </div>
    </div>
  );
}

function TextInput({ value, onChange, placeholder, prefix, mono = true }) {
  return (
    <div className="flex items-center h-9 rounded-md border border-[var(--border)] bg-[var(--surface-2)] focus-within:border-[var(--accent-dim)] focus-within:shadow-[0_0_0_3px_rgba(182,242,75,0.10)] transition overflow-hidden">
      {prefix && <span className={`px-3 text-[12px] ${mono ? 'mono' : ''} text-[var(--text-mute)] border-r border-[var(--border)] h-full flex items-center bg-[var(--surface)]/60`}>{prefix}</span>}
      <input
        type="text"
        value={value}
        onChange={e => onChange(e.target.value)}

        style={{ color: 'var(--text)' }}
      />

  );
}

      <SettingRow label="Top-P (nucleus)" hint="Sample from the smallest set of tokens whose cumulative probability ≥ p." right={`current: ${params.topP.toFixed(2)}`}>

            <div className="text-[12.5px] leading-relaxed">
              <span className="text-[var(--text)] font-medium">VRAM headroom is tight.</span>
              <span className="text-[var(--text-dim)]"> Current configuration projects 7.4 GB at peak — within 0.6 GB of the RTX 3070's 8 GB cap. Drop GPU layers to <span className="mono">38</span> or enable <span className="mono">KV cache 8-bit</span> for a safer margin.</span>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Empty placeholder for other tabs ----------
function Placeholder({ label, icon }) {
  const Icon = L[icon] || L.Box;
  return (
    <div className="flex-1 flex items-center justify-center">
      <div className="text-center">
        <div className="w-14 h-14 rounded-2xl border border-[var(--border)] bg-[var(--surface)] flex items-center justify-center mx-auto mb-3">
          <Icon size={20} className="text-[var(--text-mute)]" />
        </div>
        <div className="text-[14px] font-medium mb-1">{label}</div>
        <div className="text-[12px] text-[var(--text-mute)]">Section scaffolded · content coming next.</div>
      </div>
    </div>
  );
}

// ---------- Root ----------
function App() {
  const [active, setActive] = useState('dashboard');
  const hw = useHardware();

  return (
    <div className="h-full flex flex-col">
      <TopBar hw={hw} />
      <div className="flex-1 flex min-h-0">
        <Sidebar active={active} setActive={setActive} />
        <main className="flex-1 flex flex-col min-w-0 min-h-0">
          {active === 'dashboard' && <Dashboard hw={hw} />}
          {active === 'settings' && <Settings />}
          {active === 'models' && <Placeholder label="Models library" icon="Boxes" />}
          {active === 'agents' && <Placeholder label="OpenClaw agents" icon="Bot" />}
          {active === 'prompts' && <Placeholder label="Prompt library" icon="MessageSquare" />}
          {active === 'logs' && <Placeholder label="System logs" icon="ScrollText" />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
