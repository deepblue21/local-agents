name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Server and runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            server/requirements.lock
            server/requirements-dev.lock
            runner/requirements.lock
      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock -r ../runner/requirements.lock
      - name: Lint
        working-directory: server
        run: ruff check . ../runner
      - name: Dependency audit
        working-directory: server
        run: pip-audit -r requirements-dev.lock -r ../runner/requirements.lock --strict --progress-spinner off
      - name: Test
        working-directory: server
        run: pytest -q

  web-console:
    name: Web console end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: server/requirements.lock
      - name: Install companion dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/web-console/package-lock.json
      - name: Install Playwright
        working-directory: e2e/web-console
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run console tests
        working-directory: e2e/web-console
        env:
          LOCAL_AGENTS_PYTHON: python
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-console-traces
          path: e2e/web-console/test-results/
          retention-days: 7

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
